name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend against real PostgreSQL (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rideshare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # sqlite3 is an optional dependency used only as a local fallback; its
      # native build needs node-gyp, which fails on Python 3.12+ (distutils was
      # removed from the standard library). CI runs against PostgreSQL, which
      # is the dialect production actually uses.
      - run: npm ci --omit=optional

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rideshare_test
          DB_SSL: 'false'

      - name: Coverage
        if: matrix.node == '20'
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rideshare_test
          DB_SSL: 'false'

  bind-address:
    # The listener used to be `app.listen(PORT)`, which binds every interface.
    # This job reads the actual listening socket, because that is the only way
    # to prove the bind rather than the intent.
    name: binds loopback by default
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rideshare_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rideshare_test
      DB_SSL: 'false'
      JWT_SECRET: ci-only-secret-never-used-in-a-deployment

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=optional

      - name: Default bind is 127.0.0.1, not 0.0.0.0
        env:
          PORT: '5001'
        run: |
          set -euo pipefail
          node server.js > server.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5001/health > /dev/null && break
            sleep 1
          done

          echo "--- listening sockets on 5001 ---"
          ss -ltn 2>/dev/null | grep ':5001' || true

          if ss -ltn 2>/dev/null | grep -qE '(0\.0\.0\.0|\*):5001'; then
            echo "::error::server is listening on all interfaces by default"
            exit 1
          fi
          ss -ltn 2>/dev/null | grep -q '127.0.0.1:5001' \
            || { echo "::error::no loopback listener found on 5001"; ss -ltn; exit 1; }
          echo "loopback-only bind confirmed"

      - name: HOST=0.0.0.0 is still honoured for container hosting
        env:
          PORT: '5002'
          HOST: 0.0.0.0
        run: |
          set -euo pipefail
          node server.js > server2.log 2>&1 & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5002/health > /dev/null && break
            sleep 1
          done
          ss -ltn 2>/dev/null | grep -qE '(0\.0\.0\.0|\*):5002' \
            || { echo "::error::HOST override was ignored"; ss -ltn; exit 1; }
          echo "HOST override works"

      - name: Readiness turns green, and SIGTERM exits cleanly
        env:
          PORT: '5003'
        run: |
          set -euo pipefail
          node server.js > server3.log 2>&1 & SERVER_PID=$!

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5003/health > /dev/null && break
            sleep 1
          done
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5003/health/ready | grep -q '"status":"ready"'; then
              ready=1; break
            fi
            sleep 1
          done
          test "$ready" = "1" || { echo "::error::readiness never turned green"; cat server3.log; exit 1; }

          kill -TERM $SERVER_PID
          for i in $(seq 1 15); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "exited cleanly"; exit 0; fi
            sleep 1
          done
          echo "::error::server did not shut down on SIGTERM"
          exit 1

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      - name: Build
        run: npm run build
        env:
          CI: 'true'
          DISABLE_ESLINT_PLUGIN: 'true'

  docker:
    name: backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ride-sharing-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image refuses to start without JWT_SECRET
        run: |
          set +e
          output=$(docker run --rm -e DATABASE_URL=postgres://x:y@127.0.0.1:1/z \
            ride-sharing-backend:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "::error::started without JWT_SECRET"; exit 1; }
          echo "$output" | grep -q "JWT_SECRET" || { echo "::error::expected a JWT_SECRET error"; exit 1; }
